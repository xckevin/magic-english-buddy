<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta -->
    <meta name="theme-color" content="#6B5CE7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magic English Buddy" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Magic English Buddy - 你的魔法英语伙伴，专为儿童设计的离线英语学习应用"
    />
    <meta name="keywords" content="英语学习,儿童教育,离线学习,PWA" />

    <title>Magic English Buddy</title>

    <!-- Use device fonts: no network request is required for readable content. -->
    <style>
      /* 初始加载样式 */
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #f8f7f3;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* 初始加载动画 */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f7f3;
        z-index: 9999;
      }

      .initial-loader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(107, 92, 231, 0.2);
        border-top-color: #6b5ce7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 初始加载动画 -->
      <div class="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
